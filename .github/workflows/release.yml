name: Release

# Builds gitst for macOS, Linux and Windows and attaches the binaries to a
# GitHub release, then updates the Homebrew formula in dfallman/homebrew-tap,
# whenever a version tag (X.Y.Z, no "v") is pushed:
#
#   git tag 0.1.1 && git push origin 0.1.1
#
# The tag must match the version in Cargo.toml.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # macos-15-intel is the last Intel image (supported until Fall 2027).
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build (release)
        # --locked works because the pre-commit hook (.githooks) keeps
        # Cargo.lock's gitst version in step with Cargo.toml.
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="gitst-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md "$name/"
          [ -f LICENSE ] && cp LICENSE "$name/"
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp "target/${{ matrix.target }}/release/gitst.exe" "$name/"
            7z a "${name}.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/gitst" "$name/"
            tar czf "${name}.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: gitst-${{ matrix.target }}
          path: |
            gitst-*.tar.gz
            gitst-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS

      - name: Create GitHub release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run: refresh the assets.
            gh release upload "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "gitst $tag" \
              --generate-notes
          fi

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Regenerate formula and push to dfallman/homebrew-tap
        env:
          # Fine-grained PAT with contents:write on dfallman/homebrew-tap.
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN secret not set; skipping tap update."
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          sha() { sha256sum "artifacts/gitst-${tag}-$1.tar.gz" | cut -d' ' -f1; }

          # git asks gh for the token, so it is never in a URL, a command
          # line, or a log line that echoes either.
          gh auth setup-git
          gh repo clone dfallman/homebrew-tap tap -- --quiet
          mkdir -p tap/Formula
          cat > tap/Formula/gitst.rb << EOF
          # typed: false
          # frozen_string_literal: true

          # This formula is regenerated automatically by the release workflow in
          # dfallman/gitst (.github/workflows/release.yml) on every tagged release.
          class Gitst < Formula
            desc "Live, glanceable git status TUI for small terminal panes"
            homepage "https://github.com/dfallman/gitst"
            version "${tag}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/dfallman/gitst/releases/download/${tag}/gitst-${tag}-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              else
                url "https://github.com/dfallman/gitst/releases/download/${tag}/gitst-${tag}-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/dfallman/gitst/releases/download/${tag}/gitst-${tag}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              else
                url "https://github.com/dfallman/gitst/releases/download/${tag}/gitst-${tag}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "gitst"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/gitst --version")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gitst.rb
          git diff --cached --quiet && { echo "Formula unchanged."; exit 0; }
          git commit -m "gitst ${tag}"
          git push
